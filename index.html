<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Club de Scrabble de Mme Laurence</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lora:ital,wght@0,600;0,700;1,500&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Lora', 'serif'],
                    },
                    colors: {
                        creme: '#FAF7F0',
                        lin: '#EDE5D5',
                        linDark: '#DDD0BA',
                        bois: '#6B4C35',
                        boisDark: '#3D2E24',
                        sauge: '#5E8360',
                        saugeDark: '#446346',
                        ocre: '#D9A441',
                        terracotta: '#C86D51',
                        ardoise: '#4F6D7A'
                    }
                }
            }
        };
    </script>
    <style>
        html, body {
            height: 100vh;
            overflow: hidden;
            background-color: #F7F3EB;
            background-image: radial-gradient(#D5C9B6 0.75px, transparent 0.75px), radial-gradient(#D5C9B6 0.75px, #F7F3EB 0.75px);
            background-size: 28px 28px;
            background-position: 0 0, 14px 14px;
            color: #3D2E24;
            font-family: 'Inter', sans-serif;
        }

        .scrabble-board {
            display: grid;
            grid-template-columns: repeat(15, minmax(0, 1fr));
            grid-template-rows: repeat(15, minmax(0, 1fr));
            gap: 2px;
            background-color: #6B4C35;
            padding: 5px;
            border-radius: 12px;
            box-shadow: 0 10px 24px -6px rgba(79, 55, 37, 0.35), inset 0 2px 4px rgba(255,255,255,0.2);
            aspect-ratio: 1 / 1;
            height: min(calc(100vh - 196px), 580px, 100%);
            width: auto;
            max-width: min(95vw, 580px);
            max-height: 100%;
            margin: 0 auto;
            user-select: none;
        }

        .board-cell {
            position: relative;
            border-radius: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Nunito', 'Varela Round', 'Arial Rounded MT Bold', ui-rounded, sans-serif;
            font-size: clamp(0.54rem, 1.25vh, 0.82rem);
            font-weight: 500;
            text-align: center;
            line-height: 1.05;
            letter-spacing: -0.02em;
            cursor: pointer;
            transition: transform 0.1s ease, filter 0.12s ease;
            overflow: visible;
        }

        .board-cell > span {
            display: block;
            max-width: 100%;
            text-align: center;
            line-height: 1.05;
            word-break: keep-all;
        }

        .board-cell:hover { filter: brightness(1.06); }

        .cell-normal { background-color: #EDE5D5; color: #8C7A6B; }
        .cell-tw { background-color: #C86D51; color: #F7F3EB; }
        .cell-dw { background-color: #D9A441; color: #3D2E24; }
        .cell-tl { background-color: #4F6D7A; color: #F7F3EB; }
        .cell-dl { background-color: #6B8E6B; color: #F7F3EB; }
        .cell-star { background-color: #D9A441; color: #4F3725; font-size: clamp(0.88rem, 1.65vh, 1.25rem); }

        .board-cell.has-tile.cell-tw { box-shadow: inset 0 0 0 2px #C86D51; }
        .board-cell.has-tile.cell-dw,
        .board-cell.has-tile.cell-star { box-shadow: inset 0 0 0 2px #D9A441; }
        .board-cell.has-tile.cell-tl { box-shadow: inset 0 0 0 2px #4F6D7A; }
        .board-cell.has-tile.cell-dl { box-shadow: inset 0 0 0 2px #6B8E6B; }

        .board-cell.has-tile .wood-tile {
            width: 94%;
            height: 94%;
        }

        .wood-tile {
            width: 92%;
            height: 92%;
            background: linear-gradient(145deg, #FBF2E0 0%, #F5E6C8 100%);
            border: 1px solid #D4BC96;
            border-bottom: 2.5px solid #B89B72;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            font-family: 'Lora', serif;
            font-weight: 700;
            color: #3D2E24;
            box-shadow: 0 2px 3px rgba(61, 46, 36, 0.22);
            cursor: grab;
            z-index: 10;
            transition: transform 0.14s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.14s ease;
        }

        .wood-tile:active { cursor: grabbing; }

        .wood-tile.temp-placed {
            background: linear-gradient(145deg, #FFF7E2 0%, #F4D89E 100%);
            border-color: #D9A441;
            border-bottom-color: #B38228;
            box-shadow: 0 3px 8px rgba(217, 164, 65, 0.45);
        }

        .wood-tile.last-played-highlight {
            box-shadow: 0 0 0 3px #CA8A04, 0 0 14px rgba(234, 179, 8, 0.85);
            background: linear-gradient(145deg, #FEF9C3 0%, #FDE047 100%);
            border-color: #CA8A04;
            border-bottom-color: #854D0E;
            color: #422006;
            z-index: 15;
        }

        .wood-tile.last-played-highlight .tile-points { color: #713F12; }
        .wood-tile.joker-tile { color: #C86D51; }

        .wood-tile .tile-letter {
            font-size: clamp(1.08rem, 2.25vh, 1.55rem);
            line-height: 1;
            transform: translate(-1px, -1px);
        }

        .tile-points {
            position: absolute;
            bottom: 1.5px;
            right: 2.5px;
            font-family: 'Inter', sans-serif;
            font-size: clamp(0.46rem, 0.95vh, 0.66rem);
            font-weight: 700;
            color: #7C583D;
            line-height: 1;
        }

        .rack-slot {
            width: clamp(34px, 4.6vh, 46px);
            height: clamp(38px, 5.1vh, 50px);
            background: rgba(61, 46, 36, 0.28);
            border-radius: 7px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
        }

        .rack-tile {
            width: 100%;
            height: 100%;
            border-radius: 6px;
            border-bottom-width: 3px;
        }

        .rack-tile .tile-letter { font-size: clamp(1.05rem, 2.3vh, 1.45rem); }
        .rack-tile .tile-points { font-size: clamp(0.52rem, 1vh, 0.68rem); bottom: 2px; right: 4px; }

        .rack-tile.selected {
            transform: translateY(-6px) scale(1.05);
            box-shadow: 0 8px 14px rgba(217, 164, 65, 0.55);
            border-color: #D9A441;
        }

        .wood-rack {
            background: linear-gradient(180deg, #8B6548 0%, #6D4C33 85%, #543924 100%);
            border-top: 2px solid #A88162;
            border-bottom: 5px solid #452E1D;
            box-shadow: 0 8px 16px rgba(61, 46, 36, 0.25);
        }

        @keyframes tileBounce {
            0% { transform: scale(1.3) translateY(-8px); }
            60% { transform: scale(0.94) translateY(1px); }
            100% { transform: scale(1) translateY(0); }
        }
        .animate-tile-drop { animation: tileBounce 0.32s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }

        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: #EDE5D5; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #B8A693; border-radius: 10px; }
    </style>
</head>
